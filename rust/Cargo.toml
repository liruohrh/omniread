[package]
name = "rust_lib_omniread"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
scraper = "0.21"
boa_engine = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.12.3"
jsonpath_lib = "0.2.1"
yaml-rust = "0.4.1"
hex = "0.4.3"
base64 = "0.22.1"
md-5 = "0.10.6"
sha2 = "0.10.9"
rusqlite = { version = "0.31.0", features = ["chrono"] }
chrono = { version = "0.4.31", features = ["serde"] }
reqwest = { version = "0.12.0", features = ["cookies", "json"] }
cookie_store = "0.22.1"
url = "2.5.0"
thiserror = "1.0.50"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "js_runtime_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
